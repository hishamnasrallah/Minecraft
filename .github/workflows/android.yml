# Builds the Android APK of the Godot version on GitHub's servers and publishes it as
# a release, so it can be downloaded and installed straight from a phone.
#   https://github.com/<owner>/<repo>/releases/tag/apk-latest
name: Android APK

on:
  push:
    branches: [main]
    paths: ["godot/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and the export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Signing key and editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          for name in editor_settings-4.tres "editor_settings-${GODOT_VERSION}.tres"; do
            cat > "$HOME/.config/godot/$name" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          done
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Run the tests
        working-directory: godot
        run: |
          timeout 300 "$HOME/godot" --headless --import --path . || true
          timeout 600 "$HOME/godot" --headless --path . -s res://tests/run_tests.gd < /dev/null

      - name: Export the APK
        working-directory: godot
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          echo "SDK: $ANDROID_SDK_ROOT"; ls "$ANDROID_SDK_ROOT/build-tools" | tail -3
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | grep -i android
          mkdir -p build
          timeout 900 "$HOME/godot" --headless --verbose --path . --export-debug "Android" build/BlockWorld.apk < /dev/null 2>&1 | grep -v "^Loaded\|^EditorSettings\|^TextServer" | tail -60
          ls -la build
          test -s build/BlockWorld.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-apk
          path: godot/build/BlockWorld.apk

      - name: Publish as the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest godot/build/BlockWorld.apk \
            --title "BlockWorld APK (آخر نسخة)" --prerelease --target "$GITHUB_SHA" \
            --notes "نسخة تجريبية للأندرويد. نزّل BlockWorld.apk من الموبايل وثبّتها (اسمح بالتثبيت من مصادر غير معروفة). مبنية من ${GITHUB_SHA::7}."
